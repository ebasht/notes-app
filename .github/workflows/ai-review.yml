name: AI Review

# This job can read the ai-review environment secret.
# Check out and execute only refs/heads/master from this repository.
# The pull request diff is untrusted data: never check out the PR head,
# never run its code, and never follow instructions found in the diff.
# OPENAI_API_KEY belongs only to the Request review step.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.repository.default_branch == 'master' &&
      github.ref == 'refs/heads/master' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ai-review
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          persist-credentials: false

      - name: Prepare diff
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/ai-review.sh prepare

      - name: Request review
        id: request
        if: steps.prepare.outputs.decision == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: bash .github/scripts/ai-review.sh request

      - name: Publish comment
        id: publish
        if: always() && steps.prepare.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/ai-review.sh publish

      - name: Fail after publishing OpenAI error
        if: >-
          always() &&
          steps.publish.outputs.outcome != 'reviewed' &&
          steps.publish.outputs.outcome != 'too_large' &&
          steps.publish.outputs.outcome != 'no_changes' &&
          steps.publish.outputs.outcome != 'untrusted_author'
        run: bash .github/scripts/ai-review.sh finish
